# ruff 配置（2026-09-03 加）
#
# 只开对项目真正高价值的规则，别用 ruff 默认全量——它会误伤 air 的刻意设计：
#   BLE001（盲捕获 Exception）/ S110（try-except-pass）绝大多数是降级设计的保险
#   （AGENTS.md：落盘/归档失败静默、单个 RSS 源坏了不拖垮全部），不是 bug；
#   RUF012（可变类默认值）是 CATEGORIES / L1_CAT_FLOOR 这类「当作常量表」的类属性。
#
# F   = pyflakes 级：未定义名 / 未使用 import / 重定义（等效 pyflakes）
# E4/E7/E9 = 逻辑与运行时错误（多数条件恒真、语法类低级错误）
line-length = 100

[lint]
select = ["F", "E4", "E7", "E9"]

[lint.per-file-ignores]
# 冒烟脚本刻意在 import core 之前设 AIR2_DATA_ROOT / 插 sys.path（改根目录才干净），
# 所以 E402（import 不在文件顶部）对它们是预期模式，豁免。
"_smoke*.py" = ["E402"]
